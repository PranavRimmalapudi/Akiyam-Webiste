<!DOCTYPE html>
<!--
  AIKYAM • Gallery Page
  - Community moments and photo gallery
-->
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Explore AIKYAM's photo gallery showcasing our vibrant community events, cultural celebrations, family moments, and children's showcases. Relive the beautiful memories we've created together." />
  <meta name="keywords" content="AIKYAM, gallery, photos, community events, cultural celebrations, family moments, children showcases, memories" />
  <meta name="author" content="AIKYAM" />
  
  <!-- Open Graph / Social Media -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="AIKYAM Gallery - Community Moments & Memories" />
  <meta property="og:description" content="Explore AIKYAM's photo gallery showcasing vibrant community events and cultural celebrations." />
  <meta property="og:image" content="assets/branding/logo.png" />
  <meta property="og:url" content="https://aikyamusa.org/gallery.html" />
  
  <!-- Performance optimizations -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="assets/branding/logo.png" type="image/png" />
</head>

<body>
  <div class="tricolor" aria-hidden="true"></div>

  <div id="bg-zoom" aria-hidden="true">
    <img id="bgZoomImg" src="assets/branding/BgImage.png" alt="">
  </div>

  <!-- Header will be loaded by JavaScript -->
  <div id="header-placeholder"></div>



  <!-- ===== Photo Gallery ===== -->
  <section id="photo-gallery" class="reveal">
    <div class="container">
      <h2 class="section-title">Photo Gallery</h2>
      
      <!-- Dynamic gallery grid populated via data/galleryImages.json -->
      <div class="gallery-grid-container" id="galleryGrid" aria-live="polite" aria-busy="true"></div>
      
      <!-- Gallery Categories -->
      <div class="gallery-category-section">
        <h3 class="gallery-category-title">Explore by Category</h3>
        <div class="gallery-category-buttons">
          <button class="btn mini secondary" onclick="filterGallery('all')">All Moments</button>
          <button class="btn mini secondary" onclick="filterGallery('cultural')">Cultural Events</button>
          <button class="btn mini secondary" onclick="filterGallery('kids')">Kids Showcases</button>
          <button class="btn mini secondary" onclick="filterGallery('festivals')">Festivals</button>
          <button class="btn mini secondary" onclick="filterGallery('community')">Community Gatherings</button>
        </div>
      </div>

      <!-- Gallery Grid (single instance) -->
      <!-- Items inserted dynamically -->
    </div>
  </section>

  <canvas id="fireworks-canvas"></canvas>
  <div id="toTop" title="Back to top">↑</div>
  <div id="toast"></div>
  
  <!-- Footer will be loaded by JavaScript -->
  <div id="footer-placeholder"></div>
  
  <script src="script.js"></script>
  <!-- filterGallery implemented in script.js for dynamic data -->
</body>

</html>
